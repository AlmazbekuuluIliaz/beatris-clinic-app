openapi: 3.0.3

info:
  title: Beatris API
  version: 1.0.0
  description: API веб-приложения медицинского центра эстетической медицины Beatris

servers:
  - url: /api/v1
    description: Основной относительный адрес API

tags:
  - name: Clinic
    description: Публичная информация о клинике
  - name: Auth
    description: Регистрация, авторизация и обновление токена доступа
  - name: Users
    description: Профиль пользователя
  - name: Services
    description: Услуги медицинского центра
  - name: Specialists
    description: Специалисты медицинского центра
  - name: Appointments
    description: Онлайн-запись на приём
  - name: Products
    description: Товары интернет-магазина
  - name: Wishlist
    description: Избранные товары пользователя
  - name: Cart
    description: Корзина пользователя
  - name: Orders
    description: Заказы и оплата
  - name: Recommendations
    description: Рекомендации врача
  - name: Doctor
    description: Функции врача
  - name: Admin
    description: Управление данными в административной панели

paths:
  /clinic-info:
    get:
      tags:
        - Clinic
      summary: Получить информацию о клинике
      description: Возвращает публичную информацию о клинике, контакты, адрес и график работы.
      operationId: getClinicInfo
      responses:
        "200":
          description: Информация о клинике успешно получена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicInfo"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/register:
    post:
      tags:
        - Auth
      summary: Зарегистрировать пользователя
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь успешно зарегистрирован
          headers:
            Set-Cookie:
              description: HttpOnly cookie с refresh token
              schema:
                type: string
                example: refreshToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth/refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      tags:
        - Auth
      summary: Авторизовать пользователя
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Пользователь успешно авторизован
          headers:
            Set-Cookie:
              description: HttpOnly cookie с refresh token
              schema:
                type: string
                example: refreshToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth/refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Обновить access token
      description: Использует refresh token из защищённой HttpOnly cookie и возвращает новый access token.
      operationId: refreshAccessToken
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Access token успешно обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Завершить сеанс пользователя
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Пользователь успешно вышел из системы
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/me:
    get:
      tags:
        - Auth
      summary: Получить текущего пользователя
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Данные текущего пользователя успешно получены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/me:
    get:
      tags:
        - Users
      summary: Получить профиль пользователя
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Профиль пользователя успешно получен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - Users
      summary: Изменить профиль пользователя
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Профиль пользователя успешно изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /service-categories:
    get:
      tags:
        - Services
      summary: Получить категории услуг
      operationId: getServiceCategories
      responses:
        "200":
          description: Категории услуг успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceCategory"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /services:
    get:
      tags:
        - Services
      summary: Получить список услуг
      operationId: getServices
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: categorySlug
          in: query
          description: Slug категории услуги
          required: false
          schema:
            type: string
            example: injection-cosmetology
        - name: minPrice
          in: query
          description: Минимальная стоимость услуги
          required: false
          schema:
            type: number
            minimum: 0
            example: 10000
        - name: maxPrice
          in: query
          description: Максимальная стоимость услуги
          required: false
          schema:
            type: number
            minimum: 0
            example: 50000
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Список услуг успешно получен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /services/{slug}:
    get:
      tags:
        - Services
      summary: Получить услугу по slug
      operationId: getServiceBySlug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Услуга успешно получена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /specialists:
    get:
      tags:
        - Specialists
      summary: Получить список специалистов
      operationId: getSpecialists
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: serviceId
          in: query
          description: Фильтр по идентификатору услуги
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Список специалистов успешно получен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistListResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /specialists/{id}:
    get:
      tags:
        - Specialists
      summary: Получить специалиста по id
      operationId: getSpecialistById
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Специалист успешно получен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialist"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appointments/available-slots:
    get:
      tags:
        - Appointments
      summary: Получить свободное время для записи
      operationId: getAvailableSlots
      parameters:
        - name: specialistId
          in: query
          description: Идентификатор специалиста
          required: true
          schema:
            type: string
            format: uuid
        - name: serviceId
          in: query
          description: Идентификатор услуги
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          description: Дата для поиска свободных слотов
          required: true
          schema:
            type: string
            format: date
            example: "2026-05-20"
      responses:
        "200":
          description: Свободное время успешно получено
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableSlot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appointments:
    post:
      tags:
        - Appointments
      summary: Создать запись или заявку на приём
      description: Endpoint доступен гостю и авторизованному пациенту. Если пользователь авторизован, данные пациента могут быть подставлены из профиля.
      operationId: createAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentRequest"
      responses:
        "201":
          description: Запись на приём успешно создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appointments/my:
    get:
      tags:
        - Appointments
      summary: Получить мои записи
      operationId: getMyAppointments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Записи пациента успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appointments/{id}/cancel:
    patch:
      tags:
        - Appointments
      summary: Отменить запись на приём
      operationId: cancelAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Запись успешно отменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /product-categories:
    get:
      tags:
        - Products
      summary: Получить категории товаров
      operationId: getProductCategories
      responses:
        "200":
          description: Категории товаров успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductCategory"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products:
    get:
      tags:
        - Products
      summary: Получить список товаров
      operationId: getProducts
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: categorySlug
          in: query
          description: Slug категории товара
          required: false
          schema:
            type: string
            example: skincare
        - name: minPrice
          in: query
          description: Минимальная цена товара
          required: false
          schema:
            type: number
            minimum: 0
            example: 5000
        - name: maxPrice
          in: query
          description: Максимальная цена товара
          required: false
          schema:
            type: number
            minimum: 0
            example: 30000
        - name: sort
          in: query
          description: Сортировка товаров
          required: false
          schema:
            type: string
            enum:
              - price_asc
              - price_desc
              - newest
              - popular
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Список товаров успешно получен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/{slug}:
    get:
      tags:
        - Products
      summary: Получить товар по slug
      operationId: getProductBySlug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Товар успешно получен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /wishlist:
    get:
      tags:
        - Wishlist
      summary: Получить избранные товары
      operationId: getWishlist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Избранные товары успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WishlistItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /wishlist/items:
    post:
      tags:
        - Wishlist
      summary: Добавить товар в избранное
      operationId: addWishlistItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWishlistItemRequest"
      responses:
        "201":
          description: Товар успешно добавлен в избранное
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /wishlist/items/{productId}:
    delete:
      tags:
        - Wishlist
      summary: Удалить товар из избранного
      operationId: deleteWishlistItem
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          description: Идентификатор товара
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Товар успешно удалён из избранного
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /cart:
    get:
      tags:
        - Cart
      summary: Получить корзину пользователя
      operationId: getCart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Корзина успешно получена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /cart/items:
    post:
      tags:
        - Cart
      summary: Добавить товар в корзину
      operationId: addCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "201":
          description: Товар успешно добавлен в корзину
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /cart/items/{itemId}:
    patch:
      tags:
        - Cart
      summary: Изменить количество товара в корзине
      operationId: updateCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          description: Идентификатор позиции корзины
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: Количество товара успешно изменено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Cart
      summary: Удалить товар из корзины
      operationId: deleteCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          description: Идентификатор позиции корзины
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Товар успешно удалён из корзины
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders:
    post:
      tags:
        - Orders
      summary: Оформить заказ
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Заказ успешно оформлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders/my:
    get:
      tags:
        - Orders
      summary: Получить мои заказы
      operationId: getMyOrders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Заказы пользователя успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Получить заказ по id
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Заказ успешно получен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders/{id}/payment:
    post:
      tags:
        - Orders
      summary: Создать платёж для заказа
      operationId: createOrderPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Платёж успешно создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCreateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /recommendations/my:
    get:
      tags:
        - Recommendations
      summary: Получить мои рекомендации
      operationId: getMyRecommendations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Рекомендации успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /recommendations:
    post:
      tags:
        - Recommendations
      summary: Создать рекомендацию для пациента
      operationId: createRecommendation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
